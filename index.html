<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danny's Health Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--ink:#11151b;--muted:#69707d;
  --line:#e7e9ee;--accent:#2563eb;
  --good:#16a34a;--warn:#d97706;--bad:#dc2626;
  --good-bg:#e7f6ec;--warn-bg:#fdf3e3;--bad-bg:#fbeaea;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:18px 14px 60px}
header{margin-bottom:14px}
h1{font-size:23px;font-weight:800;letter-spacing:-.4px}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.section-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:24px 0 10px}

/* Setup banner */
.setup-banner{background:#eef3ff;border:1px solid #d6e0ff;border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:13px;color:#1e40af}
.setup-banner summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none}
.setup-banner summary::-webkit-details-marker{display:none}
.setup-banner ol{margin:12px 0 0 18px;line-height:2}
.setup-banner code{background:#dbeafe;padding:2px 6px;border-radius:4px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.url-input{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.url-input input{flex:1;min-width:200px;border:1px solid #bfdbfe;border-radius:8px;padding:8px 10px;font-size:13px;color:var(--ink)}
.url-input button{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer;white-space:nowrap}

/* Status bar */
.status-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.status-msg{font-size:13px;color:var(--muted)}
.refresh-btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.refresh-btn:hover{background:#f0f0f0}

/* Time range tabs */
.range-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.range-tab{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 16px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s}
.range-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* KPI grid */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}
@media(min-width:640px){.kpi-grid{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.kpi-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.kpi-value{font-size:25px;font-weight:800;margin:6px 0 4px;letter-spacing:-.6px}
.kpi-value .unit{font-size:12px;font-weight:600;color:var(--muted)}
.pill{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}

/* Charts */
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 14px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;flex-wrap:wrap;gap:4px}
.chart-head h3{font-size:15px;font-weight:700}
.chart-head span{font-size:12px;color:var(--muted)}
.chart-box{position:relative;height:200px}
.chart-box.sm{height:165px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:560px){.two-col{grid-template-columns:1fr}}

/* Summary */
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:640px){.summary-grid{grid-template-columns:repeat(3,1fr)}}
.summary-grid .lbl{font-size:11
